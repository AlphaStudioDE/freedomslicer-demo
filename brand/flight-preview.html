</style></head><body><span class="tag">FREEDOM SLICER · ORIGAMI FLIGHT</span><h1>Lot, który wraca do początku.</h1><p class="motion-note">Co minutę: 3 sekundy · 2 uderzenia skrzydeł · ruch korpusu i ogona · przezroczysty SVG</p>
